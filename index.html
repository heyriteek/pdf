<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Book Premium PDF Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body>

    <div id="loading-screen" class="loading-screen">
        <div class="loader-container">
            <div class="premium-spinner"></div>
            <p>Opening Document...</p>
        </div>
    </div>

    <header class="app-header">
        <button class="nav-btn" id="btn-back" onclick="window.history.back();" aria-label="Go Back">
            <span class="material-icons-round">arrow_back_ios_new</span>
        </button>
        <div class="brand-container">
            <span class="brand-logo">SB</span>
            <div class="title-container">
                <h1 id="pdf-title">Loading PDF...</h1>
                <span class="subtitle">Study Book Premium</span>
            </div>
        </div>
        <button class="nav-btn" id="btn-download" aria-label="Download PDF">
            <span class="material-icons-round">file_download</span>
        </button>
    </header>

    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <main class="viewer-container" id="viewer-container">
        <div id="pdf-render-container"></div>
    </main>

    <div class="bottom-controller-wrapper">
        <nav class="bottom-controller">
            <button class="control-btn" id="btn-zoom-out" aria-label="Zoom Out">
                <span class="material-icons-round">remove</span>
            </button>
            
            <div class="page-indicator">
                <span id="page-num">0</span> <span class="divider">/</span> <span id="page-count">0</span>
            </div>

            <button class="control-btn" id="btn-zoom-in" aria-label="Zoom In">
                <span class="material-icons-round">add</span>
            </button>

            <div class="vertical-divider"></div>

            <button class="control-btn toggle-active" id="btn-fullscreen" aria-label="Toggle Fullscreen">
                <span class="material-icons-round">fullscreen</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
