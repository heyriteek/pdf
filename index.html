<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Library</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1117;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
display:flex;
gap:15px;
align-items:center;
background:#161b22;
border:1px solid #30363d;
border-radius:18px;
padding:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.card img{
width:80px;
height:80px;
border-radius:18px;
object-fit:cover;
}

.info{
flex:1;
}

.title{
font-size:18px;
font-weight:bold;
color:#fff;
margin-bottom:5px;
}

.desc{
font-size:13px;
color:#9ca3af;
margin-bottom:12px;
line-height:20px;
}

.buttons{
display:flex;
justify-content:space-between;
}

.buttons a{
text-decoration:none;
padding:8px 18px;
border-radius:10px;
font-size:13px;
font-weight:bold;
color:#fff;
transition:.3s;
}

.view{
background:#2563eb;
}

.download{
background:#16a34a;
}

.view:hover{
background:#1d4ed8;
}

.download:hover{
background:#15803d;
}

</style>

</head>

<body>

<div class="container">

<!-- PDF 1 -->

<div class="card">

<img src="images/java.png">

<div class="info">

<div class="title">
Complete Java Notes
</div>

<div class="desc">
Beginner to Advanced Java Programming PDF.
</div>

<div class="buttons">

<a class="view"
href="pdf/java.pdf"
target="_blank">
View
</a>

<a class="download"
href="pdf/java.pdf"
download>
Download
</a>

</div>

</div>

</div>

<!-- PDF 2 -->

<div class="card">

<img src="images/python.png">

<div class="info">

<div class="title">
Python Complete Guide
</div>

<div class="desc">
Python Programming PDF with Examples.
</div>

<div class="buttons">

<a class="view"
href="pdf/python.pdf"
target="_blank">
View
</a>

<a class="download"
href="pdf/python.pdf"
download>
Download
</a>

</div>

</div>

</div>

<!-- PDF 3 -->

<div class="card">

<img src="images/android.png">

<div class="info">

<div class="title">
Android Development
</div>

<div class="desc">
Kotlin & Android Studio Full Notes.
</div>

<div class="buttons">

<a class="view"
href="pdf/android.pdf"
target="_blank">
View
</a>

<a class="download"
href="pdf/android.pdf"
download>
Download
</a>

</div>

</div>

</div>

</div>

</body>
</html>
